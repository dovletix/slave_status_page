<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Статусы генераторов</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
    <!-- Подключаем jQuery для удобства -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Добавляем скрипт для управления кнопками и подтверждениями -->
    <script type="text/javascript">
        function confirmDelete(form) {
            var generatorName = form.closest('tr').querySelector('td').innerText.trim();
            return confirm('Уверены, что хотите удалить ' + generatorName + '?');
        }

        function confirmRelease(form) {
            var generatorName = form.closest('tr').querySelector('td').innerText.trim();
            var filesToDelete = '*.csv, *.jmx, *.sh, nohup.out';
            return confirm('Точно хотите освободить генератор ' + generatorName + '?\nСледующие файлы будут удалены при освобождении генератора:\n' + filesToDelete);
        }

        $(document).ready(function() {
            // Обработчик нажатия на кнопки занять/освободить
            $('form').on('submit', function(event) {
                var form = this;
                var isRelease = form.action.includes('/release/');
                var isDelete = form.action.includes('/delete/');
                var generatorName = $(form).closest('tr').find('td').first().text().trim();
                var filesToDelete = '*.csv, *.jmx, *.sh, nohup.out';

                // Проверка подтверждения
                var confirmed = true;
                if (isRelease) {
                    confirmed = confirm('Точно хотите освободить генератор ' + generatorName + '?\nСледующие файлы будут удалены при освобождении генератора:\n' + filesToDelete);
                } else if (isDelete) {
                    confirmed = confirm('Уверены, что хотите удалить ' + generatorName + '?');
                }

                // Если пользователь отменил, прерываем отправку формы
                if (!confirmed) {
                    event.preventDefault();
                    return;
                }

                // Только если подтверждено, отключаем кнопки
                $(form).closest('tr').find('button').prop('disabled', true);
            });
        });

    </script>
</head>
<body>
<h1>Статусы генераторов</h1>
<div class="update-button">
    <form th:action="@{/updateStatuses}" method="post">
        <button type="submit">Обновить все статусы</button>
    </form>
</div>
<div class="add-button">
    <a href="/addGenerator"><button>Добавить генератор</button></a>
</div>
<table>
    <tr>
        <th>Генератор</th>
        <th>Статус</th>
        <th>Причина занятия генератора</th>
        <th>Действия</th>
    </tr>
    <th:block th:each="gen : ${generators}">
        <tr>
            <td th:text="${gen.name}">Generator Name</td>
            <td th:text="${statusMap[gen.name]}">Status</td>
            <td th:text="${descriptionMap[gen.name]}">Description</td>
            <td>
                <!-- Действия в зависимости от статуса генератора -->
                <th:block th:if="${(statusMap[gen.name] ?: '').startsWith('Свободен')}">
                    <form th:action="@{'/occupy/' + ${gen.id}}" method="post" style="display:inline; text-align:center;">
                        <div style="margin-bottom: 10px;">
                            <input class="input-box" type="text" name="userName" placeholder="Ваше имя">
                            <input class="input-box" type="text" name="description" placeholder="Причина занятия генератора">
                        </div>
                        <button type="submit">Занять генератор</button>
                    </form>
                </th:block>
                <th:block th:if="${(statusMap[gen.name] ?: '').startsWith('Занят')}">
                    <form th:action="@{'/release/' + ${gen.id}}" method="post" style="display:inline;">
                        <button type="submit" class="release-button">Освободить генератор</button>
                    </form>
                </th:block>
                <!-- Кнопка удаления генератора -->
                <form th:action="@{'/delete/' + ${gen.id}}" method="post" style="display:inline;">
                    <button class="delete-button" type="submit">🗑️</button>
                </form>
            </td>
        </tr>
    </th:block>
</table>
</body>
</html>
